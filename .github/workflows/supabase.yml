# 榜 The ranked server: schema, the sync function, auth settings, and a live attack on
# the result. Runs when the server's code or the sim it runs changes, or by hand.
#
# Needs two repository secrets, set once in GitHub → Settings → Secrets → Actions:
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was made
# Without them the run tests everything it can and says what is missing.
#
# 盾 And, when Bruno has made them on hcaptcha.com, two more for the captcha on sign-in:
#   HCAPTCHA_SECRET        a secret, the account's hCaptcha secret key
#   HCAPTCHA_SITEKEY       a repository *variable* (Settings → Variables), the site key,
#                          public by design and built into the game by pages.yml
# With only one of the two the captcha stays off, because a server asking for an answer
# the game cannot give would lock every guest out.
name: supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**', 'src/sim/**', 'src/data/**', 'src/net/names.ts', 'tools/ranked.ts', 'tools/auth-config.mjs', '.github/workflows/supabase.yml']

concurrency: { group: supabase, cancel-in-progress: false }

env:
  PROJECT_REF: yqppvmuwlhibswbbvjzz
  SUPABASE_URL: https://yqppvmuwlhibswbbvjzz.supabase.co
  SITE: https://hyoddougamer-dev.github.io/ninefold/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: The anti-cheat, the sync and the schema, tested before anything ships
        run: npx vitest run src/sim/__tests__/verify.test.ts src/sim/__tests__/sync.test.ts src/sim/__tests__/schema.test.ts

      - name: Bundle the sync core and the sim it runs into one file
        run: npx esbuild supabase/functions/sync/core.ts --bundle --format=esm --platform=neutral --target=es2022 --outfile=supabase/functions/sync/core.bundle.js

      - name: Secrets present?
        id: keys
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PASS" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are not set. Tested, not deployed."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      # 盾 Pinned, so a CLI release can never change what ships without a commit saying so.
      - uses: supabase/setup-cli@v1
        if: steps.keys.outputs.go == 'yes'
        with: { version: 2.118.0 }
      - name: Which CLI
        if: steps.keys.outputs.go == 'yes'
        run: supabase --version

      - name: Link the project
        if: steps.keys.outputs.go == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push the schema
        if: steps.keys.outputs.go == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: yes | supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy the sync function
        if: steps.keys.outputs.go == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sync --project-ref "$PROJECT_REF" --use-api

      - name: Auth settings (guests allowed, links come back to the game, codes in the email)
        if: steps.keys.outputs.go == 'yes'
        id: auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CAPTCHA_SECRET: ${{ secrets.HCAPTCHA_SECRET }}
          CAPTCHA_SITEKEY: ${{ vars.HCAPTCHA_SITEKEY }}
          # 郵 The mail server that lets the email carry a code (see tools/auth-config.mjs).
          # Only the password is a secret; the rest are repository variables.
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER: ${{ vars.SMTP_SENDER }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
        # Two calls, because the API refuses a whole PATCH for one field it will not take
        # (the email templates can be locked on a project without its own mail server),
        # and guests and links must not wait on the email's wording. The API's own
        # answer is printed either way, since a bare 400 says nothing.
        run: |
          patch() {
            code=$(curl -sS -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @"$1" -o /tmp/answer.json -w '%{http_code}')
            echo "$1 → $code"
            [ "$code" -lt 300 ] || { head -c 600 /tmp/answer.json; echo; return 1; }
          }
          if [ -n "$CAPTCHA_SECRET" ] && [ -n "$CAPTCHA_SITEKEY" ]; then
            export HCAPTCHA_SECRET="$CAPTCHA_SECRET"; echo "captcha=on" >> "$GITHUB_OUTPUT"; echo "captcha on"
          else
            echo "captcha=off" >> "$GITHUB_OUTPUT"; echo "captcha off (needs the HCAPTCHA_SECRET secret and the HCAPTCHA_SITEKEY variable)"
          fi
          node tools/auth-config.mjs core > /tmp/core.json
          node tools/auth-config.mjs mail > /tmp/mail.json
          patch /tmp/core.json
          rm -f /tmp/core.json
          patch /tmp/mail.json || echo "::warning::The email templates were refused; sign-in emails carry the link only."
          rm -f /tmp/mail.json   # it holds the mail password once there is one
          # 盾 Read back what the server now holds, so a field it quietly ignored is a red run.
          curl -sS -f "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | node -e '
              const c = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const want = { rate_limit_anonymous_users: 10, security_captcha_enabled: !!process.env.HCAPTCHA_SECRET };
              let bad = 0;
              for (const [k, v] of Object.entries(want)) {
                const ok = c[k] === v; if (!ok) bad++;
                console.log(`${ok ? "✓" : "✗"} ${k} = ${JSON.stringify(c[k])}${ok ? "" : ` (wanted ${JSON.stringify(v)})`}`);
              }
              process.exit(bad ? 1 : 0);'

      - name: The public key, read from the project (never stored here)
        if: steps.keys.outputs.go == 'yes'
        id: anon
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CAPTCHA: ${{ steps.auth.outputs.captcha }}
        run: |
          KEY=$(curl -sS -f "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | node -e '
              const k = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const pub = k.find((x) => x.type === "publishable") ?? k.find((x) => x.name === "anon");
              process.stdout.write(pub ? pub.api_key : "");')
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          # 盾 With a captcha on, the live attack makes its players as the administrator,
          # which the auth server lets past the captcha. Masked, and only read when needed.
          if [ "$CAPTCHA" = "on" ]; then
            SECRET=$(curl -sS -f "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys?reveal=true" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | node -e '
              const k = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const s = k.find((x) => x.type === "secret");
              process.stdout.write(s ? s.api_key : "");')
            echo "::add-mask::$SECRET"
            echo "secret=$SECRET" >> "$GITHUB_OUTPUT"
          fi

      # 待 The auth service takes the new settings a little while after the PATCH says 200.
      # The first live run attacked it two seconds later and was told guests were off.
      - name: Wait for the auth settings to take
        if: steps.keys.outputs.go == 'yes'
        env:
          SUPABASE_KEY: ${{ steps.anon.outputs.key }}
        run: |
          for i in $(seq 1 30); do
            if curl -sS "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_KEY" | grep -q '"anonymous_users":true'; then
              echo "guests are on"; exit 0
            fi
            sleep 6
          done
          echo "::error::Anonymous sign-ins still off after three minutes."
          curl -sS "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_KEY" | head -c 600
          exit 1

      - name: Attack the live server
        if: steps.keys.outputs.go == 'yes'
        env:
          SUPABASE_KEY: ${{ steps.anon.outputs.key }}
          CAPTCHA: ${{ steps.auth.outputs.captcha }}
          SUPABASE_SECRET: ${{ steps.anon.outputs.secret }}
        run: npx tsx tools/ranked.ts
