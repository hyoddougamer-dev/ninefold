# 驗 Reads how named players stand on the ranked server and prints it sealed, the way
# discord-read does: per-player rows never land in this repository's public logs. Only the
# session that holds the private half of tools/discord/reader.pub.pem can open it.
#
# Read-only: one SELECT through the Management API. Bruno, 2026-10-04: "valida com
# prioridade se as saves daqueles 3/4 players já estão ok e conseguem fazer sync".
# Runs on a push to the working branch that touches this file or tools/ranked-read.sql.
name: ranked-read

on:
  workflow_dispatch:
  push:
    branches: [claude/idle-fantasy-mobile-game-nzn90r]
    paths: ['.github/workflows/ranked-read.yml', 'tools/ranked-read.sql']

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and seal
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: yqppvmuwlhibswbbvjzz
        run: |
          jq -n --rawfile q tools/ranked-read.sql '{query: $q}' > /tmp/body.json
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @/tmp/body.json > /tmp/rows.json
          echo "rows: $(jq 'length' /tmp/rows.json)"
          openssl rand -out /tmp/k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/rows.json -out /tmp/rows.enc -pass file:/tmp/k.bin
          openssl pkeyutl -encrypt -pubin -inkey tools/discord/reader.pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out /tmp/k.enc
          echo "===KEY==="; base64 -w0 /tmp/k.enc; echo
          echo "===DIGEST==="; base64 -w0 /tmp/rows.enc; echo
          echo "===END==="
          shred -u /tmp/k.bin /tmp/rows.json
