# Publishes the game to GitHub Pages on every push to the branch.
#
# This is the whole update story. The installed app is a shell around this page, so a
# new version of the game arrives when this runs — nobody downloads an APK again.
name: pages

on:
  push:
    branches: [main, claude/idle-fantasy-mobile-game-nzn90r]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time **per branch**, and a push that lands mid-run wins rather than queues.
#
# It used to be one group for the whole repository, which was wrong in a way that hid
# itself: pushing the same commit to main and then to the working branch a second later
# started two runs, and the second cancelled the first. The first was main's — the only
# one that can actually publish — so the site quietly stopped updating while every push
# still looked like it had gone out.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build is not published if the suite is red. A broken page is worse than an
      # old one, because the old one is what everybody already has cached.
      - run: npm test
      - run: npm run build
      # 測 The testers' APK, beside the game, so it downloads from the game's own address.
      # The release link redirects to a signed storage URL, and a browser inside another
      # app (a chat, a mail client) tends to stop there with nothing downloaded. A plain
      # file on this site does not. If there is no release yet, the page goes out without it.
      - name: Put the testers' APK beside the game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download testers -p ninefold.apk -D dist || echo "No testers release yet."
      # Pages has to be switched on once, by hand, in Settings -> Pages -> Source:
      # GitHub Actions. The action cannot do it: `enablement: true` was tried and the
      # workflow token came back "Resource not accessible by integration", because
      # creating a Pages site needs admin rights the token does not carry.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # 主 Only main publishes. GitHub Pages deploys from the branch its environment is
  # configured for, so this job on any other branch fails at the last step — which is
  # exactly what it did, loudly, on every branch push. The branch still builds and still
  # runs the suite above, which is the part worth having on it.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
