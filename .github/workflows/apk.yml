# Builds the Android APK and puts it where testers can download it.
#
# It is deliberately *not* on every push. The APK is a shell around the hosted page and
# has no game inside it, so it only needs rebuilding when the shell itself changes:
# the icon, the name, the URL it points at. Everything else reaches the phone through
# Pages, which is the point. It also runs when the shell's own files change.
#
# 測 The build is published to the release tagged `testers`, replacing the file there,
# so the download link never changes:
#   https://github.com/hyoddougamer-dev/ninefold/releases/download/testers/ninefold.apk
name: apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [capacitor.config.json, android-test/**, public/icon-*.png, .github/workflows/apk.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build

      # Pinned to a major, so a Capacitor release cannot break a build months from now.
      - name: Add Capacitor and the Android project
        run: |
          npm i --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7
          npx cap add android
          npx cap sync android

      # The shell has no game inside it: it opens the URL in capacitor.config.json. If
      # that page is not live the APK installs and shows nothing, which is a confusing
      # way to find out. So the build says so here instead.
      - name: Check the page the shell will open
        run: |
          URL=$(node -p "require('./capacitor.config.json').server.url")
          echo "The APK will open: $URL"
          if curl -fsSL --max-time 20 -o /dev/null "$URL"; then
            echo "It is live."
          else
            echo "::warning::$URL is not answering yet. Turn GitHub Pages on \
            (Settings -> Pages -> Source: GitHub Actions) or the installed app will be blank."
          fi

      # 測 One key for every test build, so each one installs over the last. See
      # android-test/README.md for why it is in the open and why it is only for testing.
      - name: Use the testers' signing key
        run: |
          mkdir -p ~/.android
          cp android-test/debug.keystore ~/.android/debug.keystore

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Debug-signed, so it installs from a file manager after allowing unknown sources.
      # It never needs replacing unless the shell changes.
      - uses: actions/upload-artifact@v4
        with:
          name: ninefold-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The same file on a public release, which needs no GitHub account to download.
      - name: Publish to the testers release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ninefold.apk
          if ! gh release view testers >/dev/null 2>&1; then
            gh release create testers --prerelease --title "九境 Ninefold, test build" \
              --notes "Test build for testers. Install ninefold.apk and allow installs from unknown sources. The game inside updates by itself; this file only changes when the app shell does."
          fi
          gh release upload testers ninefold.apk --clobber
