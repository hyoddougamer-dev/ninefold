# 聲 Makes the Season 0 trailer voice and commits the takes to the working branch under
# media/voice/. With the secret ELEVENLABS_API_KEY it uses ElevenLabs (optional variables
# ELEVENLABS_VOICES and ELEVENLABS_MODEL); with the secret AZURE_SPEECH_KEY and the variable
# AZURE_SPEECH_REGION it uses Azure Speech. Runs by hand, or when the lines change.
name: voice

on:
  workflow_dispatch:
  push:
    branches: [claude/idle-fantasy-mobile-game-nzn90r]
    paths: ['tools/voice/**', '.github/workflows/voice.yml']

permissions:
  contents: write

jobs:
  speak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Make the takes
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICES: ${{ vars.ELEVENLABS_VOICES }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: |
          made=0
          if [ -n "$ELEVENLABS_API_KEY" ]; then node tools/voice/eleven.mjs && made=1; fi
          if [ -n "$AZURE_SPEECH_KEY" ] && [ -n "$AZURE_SPEECH_REGION" ]; then node tools/voice/azure.mjs && made=1; fi
          if [ "$made" = 0 ]; then
            echo "::warning::No voice key is set (ELEVENLABS_API_KEY, or AZURE_SPEECH_KEY with AZURE_SPEECH_REGION). Nothing was made."
          fi
      - name: Commit them to the branch
        run: |
          [ -d media/voice ] || exit 0
          git config user.name "ninefold-voice"
          git config user.email "ninefold-voice@users.noreply.github.com"
          git add media/voice
          git diff --cached --quiet && exit 0
          git commit -m "Voice: Season 0 trailer takes from Azure Speech"
          git pull --rebase origin claude/idle-fantasy-mobile-game-nzn90r && git push
